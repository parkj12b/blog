{{ if eq .Language.Lang "en" }}
<div class="mt-4 mb-4 print:hidden">
  <a
    href="https://translate.google.com/translate?sl=en&tl=ko&u={{ .Permalink | urlquery }}"
    target="_blank"
    rel="noopener noreferrer"
    class="flex items-center space-x-2 text-sm font-medium text-neutral-500 hover:text-primary-600 dark:text-neutral-400 dark:hover:text-primary-400"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 8 6 6" />
      <path d="m4 14 6-6 2-3" />
      <path d="M2 5h12" />
      <path d="M7 2h1" />
      <path d="m22 22-5-10-5 10" />
      <path d="M14 18h6" />
    </svg>
    <span>{{ i18n "article.translate" | default "Translate to Korean" }}</span>
  </a>
</div>
{{ end }}
